name: Docker Image CI

on:
  push:
    branches: [ "master", "hotfix/*" ]
  pull_request:

permissions:
  contents: read
  packages: write   # push to ghcr.io/lookbehind

jobs:
  build:
    runs-on: mysnacks-ubuntu
    steps:
      - uses: actions/checkout@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA:0:6}"
          echo "tag=${BRANCH}-${SHORT_SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Push to ghcr.io only - both prod and dev pull from ghcr.io/lookbehind.
      - name: Build and push container image
        uses: docker/build-push-action@v2
        with:
          push: true
          # Bake the source commit into the image (see Dockerfile) so it's
          # traceable even when a tag is renamed or a build is made off-CI.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/lookbehind/nopcommerce:${{ steps.meta.outputs.tag }}
          file: Dockerfile
          context: .
